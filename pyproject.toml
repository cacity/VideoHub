[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "E731",  # do not assign a lambda expression
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# The repository contains deployable website code and generated media projects
# with their own lifecycle. The desktop application's maintained regression
# suite lives here; avoiding root-wide discovery keeps moved workspace folders
# and independently runnable site tests out of the desktop CI contract.
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
